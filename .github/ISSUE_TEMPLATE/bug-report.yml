name: Bug report
description: Something in Combat Simulator 2 went wrong.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Filled in by "Open a GitHub issue" in CS2's bug report note.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
  - type: markdown
    attributes:
      value: >-
        Drag the report zip from `CombatSimulator2/reports/` in the game folder into this box. It already holds your
        character's save unless you switched that off; don't attach other save files.
